name=Ponoor PowerSTEP01 Library
version=1.2.0
author=Ponoor Experiments Inc <info@ponoor.com>
maintainer=Kanta Horio <kanta@ponoor.com>
sentence=Arduino library for the STMicroelectronics powerSTEP01 stepper motor driver, with voltage and current mode drive and daisy-chain support.
paragraph=Based on the Megunolink powerSTEP01 library (itself derived from the SparkFun AutoDriver library). Adds current mode functions, packed daisy-chain transfers, raw register accessors, EL_POS functions, corrected unit conversions, and SAMD (ARM Cortex-M0+) support.
category=Device Control
url=https://github.com/ponoor/Ponoor_PowerSTEP01_Library
architectures=*
includes=Ponoor_PowerSTEP01Library.h
